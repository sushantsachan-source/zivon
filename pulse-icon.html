<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse — interactive 3D icon</title>
<style>
  html,body{height:100%;margin:0;background:#04060a;overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
  #c{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #c.drag{cursor:grabbing;}
  .cap{position:fixed;left:0;right:0;bottom:30px;text-align:center;z-index:3;color:#a9c6ff;pointer-events:none;}
  .cap .name{font-size:13px;letter-spacing:.42em;font-weight:700;color:#bfe6ff;}
  .cap .eq{margin-top:7px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:11px;color:#5f7aa8;}
  .cap .eq b{color:#7fe8ff;}
  .hint{position:fixed;top:18px;left:0;right:0;text-align:center;color:#43597f;font-size:11.5px;letter-spacing:.05em;z-index:3;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hint">drag to rotate · hover to charge · click for a beat</div>
<div class="cap">
  <div class="name">P U L S E</div>
  <div class="eq" id="eq">r(t) = R·(1 + A·<b>♥(t)</b>) &nbsp;·&nbsp; a shockwave on every beat</div>
</div>
<script>
/* ============================================================
   PULSE — a beating 3D core that fires a shockwave each beat.
   • core  : Fibonacci-lattice sphere, 3D rotated + projected
   • beat  : double-thump heartbeat  ♥(p)=e^{-(p/σ)²}+0.55·e^{-((p-δ)/σ)²}
   • wave  : a ring is born on every beat; ρ(age)=R+v·age, α=(1-age/τ)²
   No libraries — pure canvas + maths.
   ============================================================ */
const c=document.getElementById("c"), g=c.getContext("2d");
const TAU=Math.PI*2, GOLD=Math.PI*(3-Math.sqrt(5)), frac=x=>x-Math.floor(x);
const HUE=192;                              // electric cyan
const RATE=0.95;                            // beats per second
const SIGMA=0.055, DELTA=0.19;              // heartbeat shape

let W,H,DPR; function resize(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;
  c.width=W*DPR;c.height=H*DPR;c.style.width=W+"px";c.style.height=H+"px";g.setTransform(DPR,0,0,DPR,0,0);}
addEventListener("resize",resize);resize();

/* core sphere (Fibonacci lattice) */
let pts=[]; (function(n){for(let i=0;i<n;i++){const y=1-(i/(n-1))*2,r=Math.sqrt(Math.max(0,1-y*y)),th=i*GOLD;
  pts.push({x:Math.cos(th)*r,y,z:Math.sin(th)*r,seed:i*0.6});}})(440);

/* glow sprite */
const spr=document.createElement("canvas");spr.width=spr.height=64;const sg=spr.getContext("2d");
(function(h){const q=sg.createRadialGradient(32,32,0,32,32,32);
  q.addColorStop(0,`hsla(${h+14},100%,82%,1)`);q.addColorStop(.34,`hsla(${h},100%,62%,.55)`);
  q.addColorStop(1,`hsla(${h},100%,52%,0)`);sg.fillStyle=q;sg.fillRect(0,0,64,64);})(HUE);

/* heartbeat: double thump near p=0 */
function heart(p){ return Math.exp(-Math.pow(p/SIGMA,2)) + 0.55*Math.exp(-Math.pow((p-DELTA)/SIGMA,2)); }

/* interaction */
let yaw=0.5,pitch=-0.3,vy=0,vp=0,drag=false,lx=0,ly=0,moved=0,hot=0,hotT=0,lastClick=-9;
const waves=[]; let lastPhase=0;
function beatWave(t){ waves.push(t); }
c.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;moved=0;c.classList.add("drag");});
addEventListener("pointermove",e=>{ if(!drag)return; const dx=e.clientX-lx,dy=e.clientY-ly;lx=e.clientX;ly=e.clientY;
  moved+=Math.abs(dx)+Math.abs(dy); vy=dx*0.005; vp=dy*0.005; yaw+=vy; pitch=Math.max(-1.4,Math.min(1.4,pitch+vp)); });
addEventListener("pointerup",()=>{ if(drag&&moved<6){ lastClick=performance.now()/1000; beatWave(lastClick);} drag=false;c.classList.remove("drag"); });
c.addEventListener("pointerenter",()=>hotT=1); c.addEventListener("pointerleave",()=>hotT=0);

function frame(now){
  const t=now/1000;
  hot+=(hotT-hot)*0.08;
  if(!drag){ yaw+=RATE*0.0016 + vy + 0.18*0.016; vy*=0.93; vp*=0.93; pitch+=(-0.3-pitch)*0.003; }
  const cx=W/2,cy=H/2, R=Math.min(W,H)*0.155;
  const coreR=R*0.54;

  const phase=frac(t*RATE*(1+hot*0.25));
  if(phase<lastPhase) beatWave(t);  lastPhase=phase;            // emit a wave each beat
  const click=Math.max(0,1-(t-lastClick)/0.45);
  const flash=heart(phase) + click*1.2;                        // 0 .. ~2.7
  const scale=1 + 0.30*flash*(1+hot*0.5);

  /* bg + vignette */
  g.globalCompositeOperation="source-over";g.fillStyle="#04060a";g.fillRect(0,0,W,H);
  let vg=g.createRadialGradient(cx,cy,R*0.3,cx,cy,Math.max(W,H)*0.6);
  vg.addColorStop(0,`hsla(${HUE},70%,8%,.55)`);vg.addColorStop(1,"rgba(0,0,0,0)");g.fillStyle=vg;g.fillRect(0,0,W,H);

  g.globalCompositeOperation="lighter";

  /* shockwave rings — one per beat */
  for(let i=waves.length-1;i>=0;i--){
    const age=t-waves[i], life=1.25; if(age>life){waves.splice(i,1);continue;}
    const p=age/life, rad=coreR*1.05 + p*(R*2.3), a=Math.pow(1-p,1.7)*0.9;
    g.strokeStyle=`hsla(${HUE+14},100%,76%,${a})`; g.lineWidth=4.6*(1-p)+0.6;
    g.beginPath(); g.arc(cx,cy,rad,0,TAU); g.stroke();
  }

  /* outer halo flashing with the beat */
  const halo=g.createRadialGradient(cx,cy,0,cx,cy,R*2.2);
  halo.addColorStop(0,`hsla(${HUE},100%,62%,${0.06+0.10*flash})`);
  halo.addColorStop(.5,`hsla(${HUE},100%,52%,.04)`);halo.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=halo;g.beginPath();g.arc(cx,cy,R*2.2,0,TAU);g.fill();

  /* rotation + project the beating core */
  const cyaw=Math.cos(yaw),syaw=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch),fov=3.2;
  const Rc=coreR*scale;
  for(const pt of pts){
    const rr=1+0.05*Math.sin(pt.seed+t*1.6);
    let x=pt.x*rr,y=pt.y*rr,z=pt.z*rr;
    let x1=x*cyaw+z*syaw, z1=-x*syaw+z*cyaw;
    let y2=y*cp-z1*sp, z2=y*sp+z1*cp;
    const persp=fov/(fov-z2), d=Math.max(0,Math.min(1,(z2+1.3)/2.6));
    const sx=cx+x1*Rc*persp, sy=cy+y2*Rc*persp, sz=(2+6.4*d)*persp*(0.9+0.3*flash);
    g.globalAlpha=(0.14+0.9*d*d)*(0.72+0.35*flash);
    g.drawImage(spr,sx-sz/2,sy-sz/2,sz,sz);
  }
  g.globalAlpha=1;

  /* bright core flash */
  const core=g.createRadialGradient(cx,cy,0,cx,cy,Rc*1.1);
  core.addColorStop(0,`hsla(${HUE+18},100%,90%,${0.5+0.42*flash})`);
  core.addColorStop(.4,`hsla(${HUE},100%,60%,.2)`);core.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=core;g.beginPath();g.arc(cx,cy,Rc*1.1,0,TAU);g.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
