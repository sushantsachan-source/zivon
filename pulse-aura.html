<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse &amp; Aura — interactive 3D icon</title>
<style>
  :root{ --txt:#e9eefc; --muted:#8b93b5; --panel:rgba(16,18,34,.66); --stroke:rgba(150,170,255,.18); }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{background:#05060c; color:var(--txt); overflow:hidden;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
  #c{position:fixed; inset:0; display:block; touch-action:none; cursor:grab;}
  #c.drag{cursor:grabbing;}

  /* ---- control panel ---- */
  .hud{position:fixed; top:16px; left:16px; width:288px; max-width:calc(100vw - 32px);
    background:var(--panel); border:1px solid var(--stroke); border-radius:16px; padding:14px 16px;
    backdrop-filter:blur(10px); box-shadow:0 18px 50px rgba(0,0,0,.5); z-index:5; user-select:none;}
  .hud h1{margin:0 0 2px; font-size:15px; letter-spacing:.04em;}
  .hud h1 b{background:linear-gradient(90deg,#ffd27a,#ff7a2f); -webkit-background-clip:text; background-clip:text; color:transparent;}
  .hud .eq{font-family:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace; font-size:11px; line-height:1.7;
    color:#bcd0ff; background:rgba(8,10,22,.6); border:1px solid var(--stroke); border-radius:10px;
    padding:8px 10px; margin:10px 0 12px; white-space:nowrap; overflow:auto;}
  .eq b{color:#ffd27a; font-weight:600;}
  .row{display:grid; grid-template-columns:1fr 56px; align-items:center; gap:8px; margin:7px 0; font-size:12px; color:var(--muted);}
  .row input[type=range]{grid-column:1/3; width:100%; accent-color:#ff8a3c; height:4px; margin:2px 0 0;}
  .row .val{justify-self:end; color:var(--txt); font-family:ui-monospace,monospace; font-size:11px;}
  .lbl{display:flex; justify-content:space-between; grid-column:1/3;}
  .foot{display:flex; gap:8px; margin-top:6px;}
  .foot button{flex:1; font:inherit; font-size:12px; cursor:pointer; color:var(--txt);
    background:rgba(40,46,80,.6); border:1px solid var(--stroke); border-radius:9px; padding:7px;}
  .foot button:hover{border-color:#ff8a3c;}
  .hint{position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:5;
    color:var(--muted); font-size:12px; letter-spacing:.04em; background:var(--panel);
    border:1px solid var(--stroke); border-radius:999px; padding:7px 16px; backdrop-filter:blur(8px);}
  .hint b{color:#ffd27a;}
  .min{position:absolute; top:12px; right:12px; cursor:pointer; color:var(--muted); font-size:13px;
    background:none; border:none;}
  .hud.collapsed .body{display:none;}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud" id="hud">
  <button class="min" id="min" title="collapse">▾</button>
  <h1>Pulse &amp; <b>Aura</b></h1>
  <div class="body">
    <div class="eq" id="eq"></div>
    <div id="sliders"></div>
    <div class="foot">
      <button id="ping">⚡ Pulse</button>
      <button id="reset">↺ Reset</button>
    </div>
  </div>
</div>
<div class="hint">drag to <b>rotate</b> · click anywhere for a <b>pulse</b></div>

<script>
/* ============================================================
   Pulse & Aura — a 3D icon built from maths, no dependencies.
   • sphere: Fibonacci lattice  yᵢ = 1 − 2i/(N−1),  rᵢ = √(1−yᵢ²),
             θᵢ = i·φ   (φ = π(3−√5), the golden angle)
   • pulse : r(t) = R·(1 + A·sin(2πf·t))   + a click "ping" envelope
   • aura  : ρ(t) = R·(1 + 2·frac(s·t + k/n)),  α = (1−frac)²
   • 3D    : yaw·pitch rotation matrices → perspective projection
   ============================================================ */
const c = document.getElementById("c"), g = c.getContext("2d");
const TAU = Math.PI*2, GOLDEN = Math.PI*(3-Math.sqrt(5));
const frac = x => x - Math.floor(x);

/* ---- live parameters (each maps to a term in the equations) ---- */
const DEFAULTS = { A:0.17, f:0.55, s:0.5, w:0.28, ripple:0.07, hue:28, N:820 };
let P = {...DEFAULTS};

/* ---- canvas sizing (DPR aware) ---- */
let W=0,H=0,DPR=1;
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = innerWidth; H = innerHeight;
  c.width = W*DPR; c.height = H*DPR; c.style.width=W+"px"; c.style.height=H+"px";
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize", resize); resize();

/* ---- the sphere of points (Fibonacci lattice) ---- */
let pts = [];
function buildSphere(n){
  pts = [];
  for(let i=0;i<n;i++){
    const y = 1 - (i/(n-1))*2;
    const r = Math.sqrt(Math.max(0,1 - y*y));
    const th = i*GOLDEN;
    pts.push({ x:Math.cos(th)*r, y, z:Math.sin(th)*r, seed:i*0.55 });
  }
}
buildSphere(P.N);

/* ---- glow sprite (a soft radial dot, recoloured on hue change) ---- */
const sprite = document.createElement("canvas"); sprite.width=sprite.height=64;
const sg = sprite.getContext("2d");
function recolour(hue){
  sg.clearRect(0,0,64,64);
  const grd = sg.createRadialGradient(32,32,0, 32,32,32);
  grd.addColorStop(0,  `hsla(${hue+12},100%,80%,1)`);
  grd.addColorStop(.35,`hsla(${hue},100%,60%,.55)`);
  grd.addColorStop(1,  `hsla(${hue},100%,50%,0)`);
  sg.fillStyle=grd; sg.fillRect(0,0,64,64);
}
recolour(P.hue);

/* ---- interaction: drag to rotate (with inertia), click to ping ---- */
let yaw=0.4, pitch=-0.35, vYaw=0, vPitch=0;
let dragging=false, lx=0, ly=0, moved=0;
const pings = [];                 // click pulse waves: {t0}
let lastPing = -9;
function ping(){ const t=performance.now()/1000; pings.push({t0:t}); lastPing=t; }

function down(x,y){ dragging=true; lx=x; ly=y; moved=0; c.classList.add("drag"); }
function move(x,y){ if(!dragging) return; const dx=x-lx, dy=y-ly; lx=x; ly=y; moved+=Math.abs(dx)+Math.abs(dy);
  vYaw = dx*0.005; vPitch = dy*0.005; yaw += vYaw; pitch += vPitch;
  pitch = Math.max(-1.4, Math.min(1.4, pitch)); }
function up(){ if(dragging && moved<6) ping(); dragging=false; c.classList.remove("drag"); }

c.addEventListener("pointerdown", e=>down(e.clientX,e.clientY));
addEventListener("pointermove", e=>move(e.clientX,e.clientY));
addEventListener("pointerup", up);

/* ---- the equations readout (live values) ---- */
const eqEl = document.getElementById("eq");
function updateEq(){
  eqEl.innerHTML =
    `r(t) = R·(1 + <b>${P.A.toFixed(2)}</b>·sin(2π·<b>${P.f.toFixed(2)}</b>·t))<br>`+
    `ρ(t) = R·(1 + 2·frac(<b>${P.s.toFixed(2)}</b>·t + k/n))<br>`+
    `θ&nbsp;&nbsp;&nbsp;+= <b>${P.w.toFixed(2)}</b>·dt&nbsp;&nbsp;·&nbsp;&nbsp;N = <b>${P.N}</b>`;
}

/* ---- build sliders from a config ---- */
const CTRL = [
  {k:"A",      label:"Pulse depth · A",   min:0,   max:0.4,  step:0.01},
  {k:"f",      label:"Pulse rate · f",    min:0.05,max:2,    step:0.01},
  {k:"s",      label:"Aura speed · s",    min:0.05,max:1.5,  step:0.01},
  {k:"w",      label:"Spin · ω",          min:0,   max:1.5,  step:0.01},
  {k:"ripple", label:"Surface ripple",    min:0,   max:0.2,  step:0.005},
  {k:"hue",    label:"Hue",               min:0,   max:360,  step:1},
  {k:"N",      label:"Density · N",        min:200, max:1500, step:20},
];
const slidersEl = document.getElementById("sliders");
CTRL.forEach(cfg=>{
  const row=document.createElement("div"); row.className="row";
  row.innerHTML = `<div class="lbl"><span>${cfg.label}</span><span class="val" id="v_${cfg.k}"></span></div>
    <input type="range" id="s_${cfg.k}" min="${cfg.min}" max="${cfg.max}" step="${cfg.step}">`;
  slidersEl.appendChild(row);
  const inp=row.querySelector("input"), val=row.querySelector(".val");
  const sync=()=>{ inp.value=P[cfg.k]; val.textContent = cfg.k==="N"||cfg.k==="hue" ? P[cfg.k] : P[cfg.k]; cfg._sync=sync; };
  cfg._sync=sync; sync();
  inp.addEventListener("input",()=>{
    P[cfg.k] = +inp.value; val.textContent = P[cfg.k];
    if(cfg.k==="hue") recolour(P.hue);
    if(cfg.k==="N") buildSphere(P.N|0);
    updateEq();
  });
});
function syncAll(){ CTRL.forEach(c=>c._sync && c._sync()); updateEq(); }
updateEq();

document.getElementById("ping").onclick = ping;
document.getElementById("reset").onclick = ()=>{ P={...DEFAULTS}; recolour(P.hue); buildSphere(P.N); syncAll(); };
document.getElementById("min").onclick = ()=>{ const h=document.getElementById("hud"); h.classList.toggle("collapsed");
  document.getElementById("min").textContent = h.classList.contains("collapsed")?"▸":"▾"; };

/* ---- render loop ---- */
function frame(now){
  const t = now/1000;
  // auto-spin + inertia decay
  if(!dragging){ yaw += P.w*0.016 + vYaw; pitch += vPitch; vYaw*=0.94; vPitch*=0.94;
    pitch += (Math.sin(t*0.3)*0.12 - pitch)*0.004; }   // gentle drift back toward level

  const cx=W/2, cy=H/2, R=Math.min(W,H)*0.17;

  // pulse term  r(t)=R(1+A sin 2πf t)  + click ping envelope
  let pulse = 1 + P.A*Math.sin(TAU*P.f*t);
  const pe = Math.max(0, 1-(t-lastPing)/0.7);          // ping envelope (0..1)
  pulse += 0.16*pe*Math.sin(TAU*5*(t-lastPing));
  const Rp = R*pulse;

  // background clear (crisp) + faint vignette
  g.globalCompositeOperation="source-over";
  g.fillStyle="#05060c"; g.fillRect(0,0,W,H);
  let vg=g.createRadialGradient(cx,cy,R*0.4, cx,cy,Math.max(W,H)*0.7);
  vg.addColorStop(0,`hsla(${P.hue},60%,8%,.5)`); vg.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=vg; g.fillRect(0,0,W,H);

  g.globalCompositeOperation="lighter";   // everything glows additively

  // soft aura halo behind the orb
  const halo=g.createRadialGradient(cx,cy,0, cx,cy,Rp*2.6);
  halo.addColorStop(0,`hsla(${P.hue+10},100%,60%,${0.10+0.05*pe})`);
  halo.addColorStop(.5,`hsla(${P.hue},100%,50%,.05)`);
  halo.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=halo; g.beginPath(); g.arc(cx,cy,Rp*2.6,0,TAU); g.fill();

  // continuous aura rings  ρ(t)=R(1+2 frac(s t + k/n))
  const NA=4;
  for(let k=0;k<NA;k++){
    const ph=frac(P.s*t + k/NA);
    const rad=Rp*(1.02 + ph*1.35), a=(1-ph)*(1-ph)*0.22;
    g.strokeStyle=`hsla(${P.hue+20},100%,65%,${a})`; g.lineWidth=2*(1-ph)+0.4;
    g.beginPath(); g.arc(cx,cy,rad,0,TAU); g.stroke();
  }
  // click ping rings (one-shot expanding)
  for(let i=pings.length-1;i>=0;i--){
    const age=t-pings[i].t0, life=1.2;
    if(age>life){ pings.splice(i,1); continue; }
    const ph=age/life, rad=Rp*(1 + ph*2.6), a=(1-ph)*(1-ph)*0.55;
    g.strokeStyle=`hsla(${P.hue+30},100%,72%,${a})`; g.lineWidth=3*(1-ph)+0.5;
    g.beginPath(); g.arc(cx,cy,rad,0,TAU); g.stroke();
  }

  // pre-compute rotation
  const cyaw=Math.cos(yaw), syaw=Math.sin(yaw), cpit=Math.cos(pitch), spit=Math.sin(pitch);
  const fov=3.2;
  const project=(x,y,z)=>{
    // yaw (about Y) then pitch (about X)
    let x1=x*cyaw + z*syaw, z1=-x*syaw + z*cyaw, y1=y;
    let y2=y1*cpit - z1*spit, z2=y1*spit + z1*cpit, x2=x1;
    const persp=fov/(fov - z2);
    return { sx:cx + x2*Rp*persp, sy:cy + y2*Rp*persp, d:(z2+1.3)/2.6, persp };
  };

  // the orb — additive sprites, brighter/larger toward the viewer (depth)
  for(let i=0;i<pts.length;i++){
    const p=pts[i];
    const rr=1 + P.ripple*Math.sin(p.seed + t*1.4);     // organic surface ripple
    const pr=project(p.x*rr, p.y*rr, p.z*rr);
    const d=Math.max(0,Math.min(1,pr.d));
    const a=0.10 + 0.85*d*d;
    const sz=(1.6 + 5.5*d)*pr.persp;
    g.globalAlpha=a;
    g.drawImage(sprite, pr.sx-sz/2, pr.sy-sz/2, sz, sz);
  }
  g.globalAlpha=1;

  // tilted orbit ring (a circle in 3D, rotating with its own spin)
  const NR=140, ringR=1.42, ringSpin=t*0.5;
  for(let j=0;j<NR;j++){
    const ang=j/NR*TAU + ringSpin;
    // ring lies near the equator, tilted by a fixed wobble
    const rx=Math.cos(ang)*ringR, rz=Math.sin(ang)*ringR, ry=Math.sin(ang*2+t)*0.06;
    const pr=project(rx,ry,rz);
    const d=Math.max(0,Math.min(1,pr.d));
    const sz=(0.8+2.6*d)*pr.persp;
    g.globalAlpha=0.08+0.5*d*d;
    g.drawImage(sprite, pr.sx-sz/2, pr.sy-sz/2, sz, sz);
  }
  g.globalAlpha=1;

  // bright pulsing core
  const core=g.createRadialGradient(cx,cy,0, cx,cy,Rp*0.9);
  core.addColorStop(0,`hsla(${P.hue+15},100%,85%,${0.5+0.25*pe})`);
  core.addColorStop(.4,`hsla(${P.hue},100%,60%,.22)`);
  core.addColorStop(1,"rgba(0,0,0,0)");
  g.fillStyle=core; g.beginPath(); g.arc(cx,cy,Rp*0.9,0,TAU); g.fill();

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
