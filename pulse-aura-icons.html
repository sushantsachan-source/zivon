<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pulse &amp; Aura — icon set</title>
<style>
  html,body{height:100%;margin:0;background:#06070c;color:#cdd6f0;
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;}
  header{padding:22px 26px 6px;}
  header h1{margin:0;font-size:18px;letter-spacing:.08em;font-weight:700;}
  header p{margin:5px 0 0;color:#7c87ad;font-size:13px;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;padding:14px 22px 24px;height:calc(100% - 76px);}
  .card{position:relative;border:1px solid rgba(140,160,255,.16);border-radius:18px;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.5);background:#04060a;}
  .card iframe{width:100%;height:100%;border:0;display:block;}
  .card a{position:absolute;top:12px;right:12px;z-index:2;font-size:11px;color:#9fb6ff;text-decoration:none;
    background:rgba(10,14,28,.6);border:1px solid rgba(140,160,255,.2);border-radius:8px;padding:5px 10px;backdrop-filter:blur(6px);}
  .card a:hover{border-color:#9fb6ff;}
  @media (max-width:760px){ .grid{grid-template-columns:1fr;} }
</style>
</head>
<body>
<header>
  <h1>Pulse &amp; Aura — icon set</h1>
  <p>Two standalone, dependency-free 3D icons built from maths. Drag to rotate · hover · click. Each is its own file.</p>
</header>
<div class="grid">
  <div class="card">
    <a href="pulse-icon.html" target="_blank" rel="noopener">open ↗</a>
    <iframe src="pulse-icon.html" title="Pulse icon" loading="lazy"></iframe>
  </div>
  <div class="card">
    <a href="aura-icon.html" target="_blank" rel="noopener">open ↗</a>
    <iframe src="aura-icon.html" title="Aura icon" loading="lazy"></iframe>
  </div>
</div>
</body>
</html>
